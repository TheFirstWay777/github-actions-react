#how to get access  to files by this system
name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install deps
         run: npm install --legacy-peer-deps  # Заменили npm ci на эту команду
      - name: Build project
        run: npm run build

  #atrifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          path: build
          name: build-files

